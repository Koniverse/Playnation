name: Build Story Protocol Odyssey MiniApp
on:
  pull_request:
    branches:
      - story-protocol-od-dev
      - story-protocol-od-prod
  push:
    branches:
      - story-protocol-od-dev
      - story-protocol-od-prod

jobs:
  master:
    if: "!startsWith(github.event.head_commit.message, '[CI Skip]')"
    name: Deploy Telegram MiniApp
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        token: ${{ secrets.GH_AUTOMATION_TOKEN }}
    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'yarn'
    - name: Build WebApp
      env:
        TRANSAK_API_KEY: ${{ secrets.TRANSAK_API_KEY }}
        COINBASE_PAY_ID: ${{ secrets.COINBASE_PAY_ID }}
        NFT_MINTING_HOST: ${{ secrets.NFT_MINTING_HOST }}
        BRANCH_NAME: master
        GAME_API_HOST: ${{ github.ref_name == 'story-protocol-od-prod' && 'https://sp-odyssey-api.playnation.app' || 'https://sp-odyssey-dev-api.playnation.app' }}
        TELEGRAM_WEBAPP_LINK: ${{ github.ref_name == 'story-protocol-od-prod' && 'KoniStory_bot/app' || 'story_protocol_odyssey_dev_bot/app' }}
      run: |
        yarn install --immutable | grep -v 'YN0013'
        yarn webapp:build
    - name: Publish to Cloudflare Pages
      id: cloudflare_deployment
      uses: cloudflare/pages-action@v1
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        projectName: story-protocol-odyssey
        gitHubToken: ${{ secrets.GH_AUTOMATION_TOKEN }}
        branch: ${{ github.ref_name == 'story-protocol-od-prod' && 'main' || 'dev' }}
        directory: './packages/webapp/build'
        wranglerVersion: '3'
    - name: Notify to Discord
      uses: sarisia/actions-status-discord@v1
      if: always()
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
        status: ${{ job.status }}
        username: Story Protocol Odyssey Deployment Worker
        title: ${{ github.workflow }}
        description: |
          The deployment is completed.
            - URL: ${{ steps.cloudflare_deployment.outputs.url }}
            - Alias: ${{ steps.cloudflare_deployment.outputs.alias }}
