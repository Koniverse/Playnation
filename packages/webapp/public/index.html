<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

	      content="Football Rivals">

	      content="An exciting new way to build and play with your RIVALS collection!">
	<meta name="twitter:site" content="@https://">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title"
	      content="Football Rivals">
	<meta name="twitter:description"
	      content="An exciting new way to build and play with your RIVALS collection!">
	<meta property="og:image" content="https://mythical-media.playnation.app/mythical/share_preview_2deab482bd.png"/>
	<meta property="og:image:secure_url" content="https://mythical-media.playnation.app/mythical/share_preview_2deab482bd.png"/>
	<meta property="og:image:width" content="1200"/>
	<meta property="og:image:height" content="600"/>

  <link rel="canonical" href="https://mythical-games.playnation.app"/>

  <!-- Favicon and App Icon -->
	<link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">

  <!-- Font injection -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    .startup-screen {
      overflow: hidden;
      background-size: cover;
      background-image: url("/images/startup-screen/screen-background.jpg");
      background-position: left top;
    }

    .startup-screen-logo {
      position: absolute;
      left: 50%;
      top: 0;
      width: 578px;
      height: auto;
      margin-left: -289px;
    }

    .startup-screen-powered-by {
      position: absolute;
      max-width: 144px;
      height: auto;
      left: 0;
      right: 0;
      bottom: 38px;
      margin-left: auto;
      margin-right: auto;
    }

    @media screen and (max-height: 721px) {
      .startup-screen-mockup-4 {
        bottom: auto;
        top: 335px;
      }
    }

    @keyframes fadeInOut {
        0% {
            opacity: 0.1;
        }
        50% {
            opacity: 1;
        }
        100% {
            opacity: 0.1;
        }
    }
  </style>

  <!-- Import base CSS -->
  <!--  <link href="/fonts/PlusJakartaSans/index.css" rel="stylesheet">-->
  <link href="/fonts/BarlowCondensed/index.css" rel="stylesheet">
  <link href="/fonts/Druk/index.css" rel="stylesheet">
  <link href="/fonts/PermanentMarker/index.css" rel="stylesheet">
  <link href="/assets/reset.css?v=3.01" rel="stylesheet">

  <script src="https://unpkg.com/bowser@2.11.0/es5.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js?v=7.10"></script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8H37Y2SSJM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-PZ1CMW2QSD');

    const bowser = window.bowser.getParser(window.navigator.userAgent);
    if ((typeof TelegramWebviewProxy === "undefined" && !Telegram?.WebApp?.initData) || (bowser.getPlatform()?.type === 'desktop')) {
      window.location.href = "/not-support.html";
    }
  </script>

  <!-- Import main JS logic -->
</head>

<body style="background-color: #0F0F0F;">
  <div id="root"></div>
  <div id="loading-placeholder" class="startup-screen" style="position:fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 2000">
    <img class="startup-screen-logo" src="/images/startup-screen/app-logo.png" alt="App logo">
    <img class="startup-screen-powered-by" src="/images/startup-screen/powered-by.png" alt="Powered by">
  </div>
</body>
</html>
