<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Koni Story</title>

  <meta name="title" content="Koni Story">
	<meta name="description"
	      content="A unified Telegram mini app that allows users to play with their IPs">
	<meta property="og:site_name"
	      content="Koni Story">
	<meta property="og:url" content="https://subwallet.app/">
	<meta property="og:title"
	      content="Koni Story">
	<meta property="og:type" content="website">
	<meta property="og:description"
	      content="A unified Telegram mini app that allows users to play with their IPs">
	<meta name="twitter:site" content="@https://">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title"
	      content="Koni Story">
	<meta name="twitter:description"
	      content="A unified Telegram mini app that allows users to play with their IPs">
	<meta property="og:image" content="https://file-library.subwallet.app/preview-images/webapp.png"/>
	<meta property="og:image:secure_url" content="https://file-library.subwallet.app/preview-images/webapp.png"/>
	<meta property="og:image:width" content="1200"/>
	<meta property="og:image:height" content="600"/>
  <meta name="app:version" content="<%= htmlWebpackPlugin.options.meta['app-version'] %>">
	<meta name="copyright" content="Koni Story"/>

  <link rel="canonical" href="https://telegram.playnation.app/"/>

  <!-- Favicon and App Icon -->
	<link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">

  <!-- Font injection -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    .startup-screen {
      overflow: hidden;
    }

    .startup-screen-background {
      position: absolute;
      inset: 0;
      background-image: url("/images/startup-screen/background.png");
      background-repeat: no-repeat;
      background-size: 390px auto;
      background-position: center bottom;
      z-index: 1;
    }

    .startup-screen-title {
      font-size: 40px;
      line-height: 52px;
      color: #000;
      font-weight: 700;
      max-width: 240px;
      position: relative;
      z-index: 10;
      margin-top: 24px;
      margin-left: 28px;
      margin-bottom: 12px;
    }

    .startup-screen-subtitle {
      position: relative;
      z-index: 2;
      font-size: 20px;
      line-height: 26px;
      color: #000;
      font-weight: 600;
      margin-left: 28px;
    }

    @media screen and (max-height: 721px) {

    }

    @keyframes fadeInOut {
        0% {
            opacity: 0.1;
        }
        50% {
            opacity: 1;
        }
        100% {
            opacity: 0.1;
        }
    }
  </style>

  <!-- Import base CSS -->
  <link href="/fonts/PlusJakartaSans/index.css" rel="stylesheet">
  <link href="/assets/reset.css?v=3.01" rel="stylesheet">

  <script src="https://telegram.org/js/telegram-web-app.js?v=7.7"></script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-C01KRVB114"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-C01KRVB114');

    // if (typeof TelegramWebviewProxy === "undefined" && !Telegram?.WebApp?.initData) {
    //   window.location.href = "/not-support.html";
    // }
  </script>

  <!-- Import main JS logic -->
</head>

<body style="background-color: #F0F7F8;">
  <div id="root"></div>
  <div id="loading-placeholder" class="startup-screen" style="position:fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 2000">
    <div class="startup-screen-background"></div>

    <div class="startup-screen-title">
      Welcome to Koni Story
    </div>

    <div class="startup-screen-subtitle">
      Your IP journey awaits…
    </div>
  </div>

  <script>
    let currentTheme;

    try {
      currentTheme = localStorage.getItem('currentTheme') || 'default';
    } catch (e) {
      currentTheme = 'default'
    }

    let backGroundStyle;

    if (currentTheme === 'sky') {
      backGroundStyle = '#C7F0FF';
    } else if (currentTheme === 'morning_sunny') {
      backGroundStyle = '#FFF8C4';
    } else if (currentTheme === 'spring') {
      backGroundStyle = '#7EEC79';
    } else if (currentTheme === 'lavender') {
      backGroundStyle = '#BB9EFF';
    } else if (currentTheme === 'sunny') {
      backGroundStyle = '#FBCE01';
    } else if (currentTheme === 'begie') {
      backGroundStyle = '#EBD7C9';
    } else if (currentTheme === 'clove') {
      backGroundStyle = 'linear-gradient(117deg, #A2F6C1 9.05%, #CBF147 91.43%)';
    } else if (currentTheme === 'aurora') {
      backGroundStyle = 'linear-gradient(117deg, #A2F6C1 9.05%, #9FE3FF 91.43%)';
    } else {
      backGroundStyle = 'linear-gradient(117deg, #FFD8E6 9.05%, #BCEBFF 91.43%)';
    }

    document.getElementById("loading-placeholder").style.background = backGroundStyle;
  </script>
</body>
</html>
